{% extends 'base.html' %}
{% load ds_icons %}
{% block title %}Excluir Precificação{% endblock %}
{% block content %}
<div class="page-header"><div class="page-header__title">{% icon "trash" %}<h1 style="font-size: var(--text-xl);">Excluir Precificação</h1></div></div>
<div class="card max-w-md">
  <div class="card__body">
    <p class="mb-4">Tem certeza que deseja excluir a precificação de <strong>{{ object.item_cardapio }}</strong>?</p>
    <form method="post" class="btn-group">
      {% csrf_token %}
      <button type="submit" class="btn btn--danger">{% icon "trash" class="icon-sm" %}Confirmar exclusão</button>
      <a href="{% url 'precificacao:formacaopreco_list' %}" class="btn btn--outline">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
