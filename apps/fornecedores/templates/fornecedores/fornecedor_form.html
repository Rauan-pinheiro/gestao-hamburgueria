{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Editar{% else %}Novo{% endif %} Fornecedor{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-truck me-2"></i>{% if object %}Editar{% else %}Novo{% endif %} Fornecedor</h4>
<div class="card"><div class="card-body">
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
      <a href="{% url 'fornecedores:fornecedor_list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div></div>
{% endblock %}
