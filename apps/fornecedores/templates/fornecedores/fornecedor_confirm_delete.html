{% extends 'base.html' %}
{% block title %}Excluir Fornecedor{% endblock %}
{% block content %}
<h4 class="mb-3">Excluir Fornecedor</h4>
<div class="card"><div class="card-body">
  <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>? Esta ação não pode ser desfeita.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Confirmar exclusão</button>
    <a href="{% url 'fornecedores:fornecedor_list' %}" class="btn btn-outline-secondary">Cancelar</a>
  </form>
  {% include 'partials/_excluir_cascata.html' %}
</div></div>
{% endblock %}
