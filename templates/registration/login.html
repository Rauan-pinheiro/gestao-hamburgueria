{% extends 'base.html' %}
{% load static %}
{% block title %}Entrar{% endblock %}
{% block content_public %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: var(--bg);">
  <div class="card shadow-sm border-0" style="width: 100%; max-width: 380px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-egg-fried" style="font-size:2.2rem; color: var(--primary);"></i>
        <h4 class="mt-2 mb-0">Hamburgueria ERP</h4>
        <small class="text-muted">Acesse sua conta</small>
      </div>

      {% include 'partials/_messages.html' %}

      {% if form.errors %}
      <div class="alert alert-danger py-2">Usuário ou senha inválidos.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Usuário</label>
          <input type="text" name="username" class="form-control" id="id_username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Senha</label>
          <input type="password" name="password" class="form-control" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
