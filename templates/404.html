<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Página não encontrada · Gestão Hamburgueria</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#12141c; color:#e7e9ee; font-family: 'Segoe UI', system-ui, sans-serif; }
  .box { text-align:center; max-width:420px; padding:2rem; }
  .code { font-size:3rem; margin:0; color:#d9480f; }
  h1 { font-size:1.3rem; margin:.5rem 0 1rem; }
  p { color:#9aa0ae; line-height:1.5; }
  a { display:inline-block; margin-top:1rem; background:#d9480f; color:#fff; text-decoration:none;
    padding:.6rem 1.4rem; border-radius:.5rem; }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi removido.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
