{% load ds_icons %}
{% with app=request.resolver_match.app_name %}
<nav class="bottom-nav" aria-label="Navegação principal">
  <a href="{% url 'dashboard:index' %}" class="bottom-nav__link{% if app == 'dashboard' %} is-active{% endif %}">
    {% icon "speedometer2" %}<span>Início</span>
  </a>
  <a href="{% url 'estoque:ingrediente_list' %}" class="bottom-nav__link{% if app == 'estoque' %} is-active{% endif %}">
    {% icon "box-seam" %}<span>Estoque</span>
  </a>
  <a href="{% url 'vendas:venda_list' %}" class="bottom-nav__link{% if app == 'vendas' %} is-active{% endif %}">
    {% icon "cart-check" %}<span>Vendas</span>
  </a>
  <a href="{% url 'despesas:despesa_list' %}" class="bottom-nav__link{% if app == 'despesas' %} is-active{% endif %}">
    {% icon "wallet2" %}<span>Despesas</span>
  </a>
  <a href="#" class="bottom-nav__link" data-toggle-sidebar>
